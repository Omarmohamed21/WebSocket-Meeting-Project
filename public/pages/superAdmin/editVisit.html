<!DOCTYPE html>
<html>
  <head>
    <title>Visit Details</title>
    <link rel="stylesheet" href="../../css/editVisit.css" />
  </head>
  <body>
    <div class="card">
      <h2>Visit Details</h2>

      <div class="field">
        <span>Name:</span>
        <p id="vName"></p>
      </div>
      <div class="field">
        <span>Job:</span>
        <p id="vJob"></p>
      </div>
      <div class="field">
        <span>Rank:</span>
        <p id="vRank"></p>
      </div>
      <div class="field">
        <span>Unit:</span>
        <p id="unit"></p>
      </div>
      <div class="field">
        <span>Status:</span>
        <p id="status"></p>
      </div>
      <div class="field">
        <span>Finished:</span>
        <p id="isFinished"></p>
      </div>
      <div class="field">
        <span>Note:</span>
        <p id="note"></p>
      </div>

      <button onclick="history.back()">Back</button>
    </div>

    <script src="../../js/authGuard.js"></script>
    <script src="../../js/superAdmin/editVisit.js"></script>
  </body>
</html>
